# =====================================================================
# Karuṇā Backend — PostgreSQL configuration
# =====================================================================

spring.application.name=karuna-backend
server.port=8081

# PostgreSQL
# 🏠 LOCAL (comment out when deploying)
# spring.datasource.url=jdbc:postgresql://localhost:5432/karuna
# spring.datasource.username=postgres
# spring.datasource.password=admin123

# ☁️  NEON PRODUCTION DATABASE (Singapore - ap-southeast-1)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-young-shadow-aoaosrnl.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_lQzg2Um5YiBA}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon connection pool (use this for better performance)
# spring.datasource.url=jdbc:postgresql://ep-young-shadow-aoaosrnl-pooler.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
karuna.jwt.secret=${KARUNA_JWT_SECRET:KaruNa2026SecReTKeyForJWTTokenGenerationMustBeLongEnough256Bits!!}
karuna.jwt.expiration=86400000

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── AI Provider ───────────────────────────────────────────────────────
# 🔀 Switch between providers by changing ONE line:
#    ai.provider=claude   ← uses Claude (Anthropic)
#    ai.provider=gemini   ← uses Gemini (Google) [free tier]
# locally set to 'claude' or 'gemini'; on Render set AI_PROVIDER env variable
ai.provider=gemini

# 🔑 Claude — paste key here for local dev, OR set CLAUDE_API_KEY on Render
claude.api.key=${CLAUDE_API_KEY:PASTE_YOUR_CLAUDE_KEY_HERE}
claude.model=claude-3-5-haiku-20241022
claude.base-url=https://api.anthropic.com/v1/messages

# 🔑 Gemini — paste key here for local dev, OR set GEMINI_API_KEY on Render
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-1.5-flash
gemini.base-url=https://generativelanguage.googleapis.com/v1beta/models
