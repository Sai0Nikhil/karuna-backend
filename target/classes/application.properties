# =====================================================================
# Karuṇā Backend — PostgreSQL configuration
# =====================================================================

spring.application.name=karuna-backend
server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/karuna
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
karuna.jwt.secret=KaruNa2026SecReTKeyForJWTTokenGenerationMustBeLongEnough256Bits!!
karuna.jwt.expiration=86400000

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
